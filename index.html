<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DietLog - 我的饮食记录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto p-4">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-green-600">🍎 DietLog</h1>
      <p class="text-gray-600">记录你的每一天饮食</p>
    </header>

    <!-- 添加记录 -->
    <div class="bg-white rounded-2xl shadow p-6 mb-8">
      <h2 class="text-xl font-semibold mb-4">📝 添加今日饮食 / 运动</h2>
      <form id="logForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="date" id="date" class="border p-3 rounded-xl">
        
        <select id="meal" class="border p-3 rounded-xl">
          <option value="早餐">早餐</option>
          <option value="午餐">午餐</option>
          <option value="晚餐">晚餐</option>
          <option value="加餐">加餐</option>
          <option value="运动">运动 (消耗)</option>
        </select>

        <!-- 食物选择 + 自定义 -->
        <div class="md:col-span-3">
          <label class="block text-sm text-gray-600 mb-1">食物 / 运动项目</label>
          <input list="foodList" id="food" placeholder="选择或输入食物名称" class="border p-3 rounded-xl w-full">
          <datalist id="foodList"></datalist>
        </div>

        <input type="text" id="quantity" placeholder="份量（如：200g / 30分钟）" class="border p-3 rounded-xl">
        <input type="number" id="calories" placeholder="热量（kcal）" class="border p-3 rounded-xl" step="1">
        
        <button type="submit" class="md:col-span-3 bg-green-600 text-white py-4 rounded-2xl font-medium hover:bg-green-700 transition text-lg">
          + 添加记录
        </button>
      </form>
    </div>

    <!-- 今日总结 -->
    <div id="todaySummary" class="bg-white rounded-2xl shadow p-6 mb-8 hidden">
      <h2 class="text-xl font-semibold mb-3">📅 今日总结</h2>
      <div id="summaryContent" class="grid grid-cols-2 gap-4"></div>
    </div>

    <!-- 历史记录 -->
    <div class="bg-white rounded-2xl shadow p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">📜 历史记录</h2>
        <button onclick="exportData()" class="text-green-600 hover:underline text-sm">导出备份</button>
      </div>
      <div id="logsList" class="space-y-3"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
